name: digital_library
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  emailjs: ^4.0.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  http: ^1.3.0
  path_provider: ^2.0.15
  syncfusion_flutter_pdfviewer: ^29.1.35
  syncfusion_flutter_core: ^29.1.35
  supabase_flutter: ^2.8.4
  universal_html: ^2.2.4
  url_launcher: ^6.1.10
  uuid: ^4.5.1
  virtual_keyboard_multi_language: ^1.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/.env
    - lib/template/email_template.html

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
